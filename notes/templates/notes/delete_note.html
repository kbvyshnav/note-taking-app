{% extends 'notes/base.html' %}

{% block title %} Delete Note {% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger display-4"></i>
                <h1 class="card-title mt-3">Delete Note</h1>

                <p class="text-muted">Are you sure you want to delete this note? This action cannot be undone.</p>
                <h5 class="mb-4">"{{ note.title }}"</h5>

                <form method="POST" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Yes, Delete
                    </button>
                </form>

                <a href="{% url 'note_detail' note.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
