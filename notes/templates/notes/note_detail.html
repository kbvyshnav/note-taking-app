{% extends 'notes/base.html' %}

{% block title %} {{ note.title }} {% endblock %}

{% block content %}

<h1>
    {% if note.is_pinned %}
        📌
    {% endif %}

    {{ note.title }}
</h1>

<p> {{ note.content | linebreaks }} </p>

<p>
    <strong> Created : </strong>
    {{ note.created_at }}
</p>

<form method="POST" action="{% url 'toggle_pin' note.pk %}">
    {% csrf_token %}

    <button type="submit">
        {% if note.is_pinned %}
            Unpin
        {% else %}
            Pin
        {% endif %}
    </button>

    <p>
        <a href="{% url 'edit_note' note.pk %}"> Edit Note </a>
    </p>

    <p>
        <a href="{% url 'delete_note' note.pk %}"> Delete Note </a>
    </p>
    

</form>



{% endblock %}
